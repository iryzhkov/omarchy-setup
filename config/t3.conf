# T3 Code and t3-steward: the versions this fleet runs.
#
# These two move together. t3-steward is written against T3's undocumented
# control protocol and log formats, and it refuses to warn, stop or resume
# when the T3 server version falls outside the range it was built against.
# Floating either one alone silently disables the quota watchdog.
#
# The versions below are the floor, not the ceiling. With T3_AUTO_UPDATE on,
# modules/common/26-t3.sh looks for a newer pair on every run -- which means on
# every `omarchy update`, through the post-update hook -- and records what it
# installed in ~/.local/state/omarchy-setup/t3-versions.conf. Editing either
# version here overrides that record on the next run, in both directions, so a
# rollback is a one-line change plus a run.

# T3 Code, published to npm as `t3`.
T3_VERSION=0.0.38

# t3-steward, from GitHub releases.
T3_STEWARD_VERSION=0.10.1
T3_STEWARD_REPO=iryzhkov/t3-steward

# Follow new releases automatically. The candidate steward binary is downloaded
# and asked which T3 versions it was tested with (`t3-steward version` prints
# the range), and the newest T3 inside that range is installed with it. The
# pair only ever moves forward: a steward whose range would step T3 back, or
# for which npm has no matching T3 at all, is left where it is.
#
# Set to 0 to freeze this host on the versions above.
T3_AUTO_UPDATE=1

# Consider t3-steward prereleases. This fleet runs the steward's prereleases on
# purpose -- it is our own project and its fixes arrive there first -- so this
# is on. T3 itself is only ever taken from npm's finished versions.
T3_STEWARD_PRERELEASES=1

# Restart t3code.service once the installed T3 differs from the version the
# server is still serving *and* the steward reports no thread running. A
# restart kills every thread in flight, so a busy host defers to the next run.
# Set to 0 to be told about the pending restart and choose the moment yourself.
T3_RESTART_WHEN_IDLE=1

# When the module's own timer runs the check, as an OnCalendar time of day.
# `omarchy update` is the main trigger, but it only fires when someone runs it,
# and homelab has no such command at all, so every host also carries
# t3-update.timer -- generated by the module, 20 minutes of jitter, Persistent
# so a machine that was asleep catches up.
T3_UPDATE_ON_CALENDAR=09:15

# Address the T3 server binds to, used only when this module seeds a
# t3code.service that does not exist yet. An existing unit is never rewritten.
T3_BIND=0.0.0.0
T3_PORT=7391
