# SSH setup for remote hosts. Safe to commit -- public keys only, never private.

# Preferred: authorized keys are pulled from https://github.com/<user>.keys by
# `omarchy setup security sshd --gh-keys`, so a fresh box trusts your existing
# GitHub keys with nothing to copy by hand.
#
# The account name lives in config/defaults.conf (GITHUB_USER), overridable
# with --github-user. REQUIRES a public key published to that account: one with
# no keys returns HTTP 200 with an empty body, so the fetch silently yields
# nothing. See the README -- `admin:public_key` is not in gh's default scopes.

# Fallback / addition: authorize a literal public key. Works with no GitHub
# dependency at all. Both may be set; each is applied in its own call because
# Omarchy's command refuses --key and --gh-keys together.
# SSH_PUBKEY="ssh-ed25519 AAAA... igor@omarchy-macbook-air-igor"

# Disable password authentication once keys are in place. Omarchy's own setup
# leaves passwords enabled; this adds a drop-in on top.
HARDEN_PASSWORD_AUTH=1

# Subnets that reach port 22 without ufw's rate limit. Omarchy opens SSH with
# `ufw limit 22/tcp`, which refuses a source that opens six connections in 30
# seconds; the steward's admin transport and parallel agents exceed that from
# the trusted VLANs. Each subnet gets an ALLOW rule inserted ahead of the LIMIT
# rule, which stays in force for every other source. An ALLOW removes
# brute-force rate limiting for every address on the subnet, so the module
# applies it only when the effective sshd configuration for that subnet has
# password, keyboard-interactive and root login disabled, and refuses
# otherwise. Set SSH_TRUSTED_SUBNETS=() to keep every source rate limited.
SSH_TRUSTED_SUBNETS=(192.168.70.0/24 192.168.90.0/24)
