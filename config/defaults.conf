# Personal defaults for this fork.
#
# Precedence: command-line flag  >  environment variable  >  value here.
# So a fork edits this one file -- and someone trying the repo out can override
# anything without editing it at all:
#
#   ./run.sh --github-user octocat --git-email me@example.com
#   BW_SERVER= ./run.sh          # empty = the official Bitwarden cloud
#
# Nothing secret belongs here. Addresses and usernames only.

# GitHub account. Authorized SSH keys are fetched from https://<user>.keys, and
# the repo URLs below derive from it, so a fork only changes this one name.
GITHUB_USER="${GITHUB_USER:-iryzhkov}"

# Git identity written on a fresh machine by modules/common/15-git.sh.
GIT_NAME="${GIT_NAME:-Igor Ryzhkov}"
GIT_EMAIL="${GIT_EMAIL:-igor.o.ryzhkov@gmail.com}"

# Self-hosted Bitwarden/Vaultwarden. Leave empty for the official cloud vault.
BW_SERVER="${BW_SERVER-https://vault.ryzhkov.dev}"

# Neovim config repo cloned to ~/.config/nvim.
NVIM_REPO="${NVIM_REPO:-https://github.com/$GITHUB_USER/nvim-configuration.git}"

# OpenViking memory store, reached by agents through the ov-mcp server that
# modules/common/45-agents.sh installs from OV_MCP_REPO. The API key is not
# here: ov-mcp reads OV_API_KEY, then ~/.config/ov-mcp/config.toml, then the
# GNOME keyring (service=openviking key=api).
OV_BASE_URL="${OV_BASE_URL:-http://192.168.70.223:1933}"
OV_MCP_REPO="${OV_MCP_REPO:-https://github.com/$GITHUB_USER/ov-mcp.git}"
