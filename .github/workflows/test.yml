name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and luac
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck lua5.4
      - name: shellcheck
        run: |
          # config/bin carries a Python helper or two, and shellcheck reports a
          # file it cannot parse as an error, so the list is filtered by shebang
          # the same way test/run.sh filters what it runs `bash -n` over.
          scripts=()
          for f in run.sh install.sh uninstall.sh lib/*.sh modules/*/*.sh \
                   packages/*/*.sh bin/* config/bin/* config/hooks/*/*.hook test/run.sh; do
            if head -c 64 "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then
              scripts+=("$f")
            fi
          done
          # SC1090/1091: sourced files resolved at runtime. SC2094: false positive on
          # `write_owned_file dest <src`. SC2016: tests pass '$1' to bash -c on purpose.
          shellcheck -x -e SC1090,SC1091,SC2094,SC2016 "${scripts[@]}"
      - name: Module tests against a throwaway HOME
        run: test/run.sh
      - name: Shared agent instruction generation
        run: python3 test/agents-instructions.py
  sandbox-qualification:
    # This job is unconditional; branch protection must require its exact-head result.
    runs-on: ubuntu-24.04
    env:
      T3_LAPTOP_REQUIRE_SANDBOX: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GOMAXPROCS: "1"
      GOFLAGS: "-p=1"
      MAKEFLAGS: "-j1"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Provision authenticated Bubblewrap 0.12.0 on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential pkg-config libcap-dev meson ninja-build curl xz-utils
          sandbox_build=$(mktemp -d)
          trap 'rm -rf "$sandbox_build"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz \
            -o "$sandbox_build/bubblewrap-0.12.0.tar.xz"
          printf '%s  %s\n' 9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314 \
            "$sandbox_build/bubblewrap-0.12.0.tar.xz" | sha256sum -c -
          tar -xJf "$sandbox_build/bubblewrap-0.12.0.tar.xz" -C "$sandbox_build"
          meson setup "$sandbox_build/build" "$sandbox_build/bubblewrap-0.12.0" -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$sandbox_build/build" -j 1
          # Application uses this absolute path; a PATH/prefix install is insufficient.
          sudo install -m 0755 "$sandbox_build/build/bwrap" /usr/bin/bwrap
          test "$(/usr/bin/bwrap --version)" = 'bubblewrap 0.12.0'
          # Ubuntu 24.04 AppArmor restricts unprivileged userns by default.
          # Only this disposable GitHub runner is changed; never run on a worker host.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp -- /usr/bin/true
      - name: Required real sandbox qualification and deterministic refusal tests
        run: python3 test/laptop-worker-isolation.py
      - name: Real unavailable prerequisites must refuse mandatory qualification
        run: python3 test/sandbox-prerequisites.py
