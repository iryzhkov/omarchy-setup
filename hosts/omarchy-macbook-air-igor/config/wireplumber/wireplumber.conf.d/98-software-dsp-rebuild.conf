# Load the filter-chain rebuild hook next to the stock software-dsp script.
# See ~/.local/share/wireplumber/scripts/node/software-dsp-rebuild.lua for why.
wireplumber.components = [
  {
    name = node/software-dsp-rebuild.lua, type = script/lua
    provides = node.software-dsp-rebuild
    requires = [ node.software-dsp ]
  }
]

wireplumber.profiles = {
  main = {
    node.software-dsp-rebuild = required
  }
}
