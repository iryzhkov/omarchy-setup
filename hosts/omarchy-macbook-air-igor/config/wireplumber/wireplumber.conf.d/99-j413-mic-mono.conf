# Replace (not extend: fragments append to arrays, and every matching rule
# would create its own filter) the asahi-audio software-dsp rules with the two
# this machine needs. The speaker graph is the packaged file; the mic graph is
# a generated copy with a MONO output channel so the audio panel's level meter
# works. Everything else in the packaged rule list is for other Mac models.
override.node.software-dsp.rules = [
  {
    matches = [ { api.alsa.path = "hw:AppleJ413,1" } ]
    actions = { create-filter = { filter-path = "/home/igor/.config/asahi-audio/j413-speakers.json", hide-parent = true } }
  }
  {
    matches = [ { api.alsa.path = "hw:AppleJ413HPAI,0" } ]
    actions = { create-filter = { filter-path = "/home/igor/.config/asahi-audio/j413-mic.json", hide-parent = true } }
  }
]
